h="200" value="${val('overtime')}" placeholder="Must be agreed in advance"></div><div class="field"><label for="jContact">${esc(t('Contact preference'))}</label><select id="jContact" name="contactPreference">${['Share details only after a worker responds','Use the demo workflow only','To be agreed'].map(v=>`<option value="${esc(v)}" ${j.contactPreference===v?'selected':''}>${esc(t(v))}</option>`).join('')}</select></div></div><div class="warning" style="margin-top:18px"><h3>${ico('shield')} Clear terms build trust</h3><p class="small" style="margin-top:6px">Do not include private phone numbers, exact home addresses, passwords, OTP requests or upfront fees. This is a fictional demo.</p></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-view="myjobs">${esc(t('Cancel'))}</button><button type="submit" class="btn btn-primary">${ico('doc')}${esc(t('Preview listing'))}${ico('arrow')}</button></div></form></section>`}
function collectJobForm(form){const f=new FormData(form),old=state.editingJobId?jobBy(state.editingJobId):null;return {id:old?.id||newId(),title:String(f.get('title')||'').trim(),trade:String(f.get('trade')||'Other'),company:state.employer.name,employerId:state.employer.id,area:String(f.get('area')||'').trim(),pay:Number(f.get('pay')),basis:String(f.get('basis')||''),hours:String(f.get('hours')||'').trim(),duration:String(f.get('duration')||'').trim(),start:String(f.get('start')||'').trim(),paymentTiming:String(f.get('paymentTiming')||'').trim(),paymentMethod:String(f.get('paymentMethod')||''),tools:String(f.get('tools')||'').trim(),expenses:String(f.get('expenses')||'').trim(),overtime:String(f.get('overtime')||'').trim()||'Not specified — confirm before accepting',workersNeeded:Number(f.get('workersNeeded')),tasks:String(f.get('tasks')||'').trim(),status:old?.status||'Published',createdAt:old?.createdAt||dateToday(),verified:false,contactPreference:String(f.get('contactPreference')||'')};}
function renderPreview(){const j=state.draftJob;if(!j)return `${pageHead('Post a Job','No job selected','')}<button class="btn btn-secondary" data-view="post">${esc(t('Back'))}</button>`;const required=['title','trade','tasks','workersNeeded','area','start','hours','duration','pay','basis','paymentTiming','paymentMethod','tools','expenses'];const missing=required.filter(k=>j[k]===undefined||j[k]===null||String(j[k]).trim()==='');return `${pageHead('Draft preview','Draft preview','Review the complete listing before publishing.')}<div class="steps"><span class="step"><b>1</b> Job details</span><span class="step-line"></span><span class="step active"><b>2</b> Preview listing</span><span class="step-line"></span><span class="step"><b>3</b> Publish</span></div>${missing.length?`<div class="danger" style="margin-bottom:15px"><h3>${esc(t('Missing essential details'))}</h3><p class="small" style="margin-top:5px">${esc(t('Complete the highlighted fields before publishing.'))} ${esc(missing.join(', '))}</p></div>`:''}<section class="panel pad"><div class="detail-top"><div class="trade-icon">${ico(tradeIcon(j.trade))}</div><div><h1 class="detail-title">${esc(j.title)}</h1><p style="margin-top:6px">${esc(state.employer.name)} · ${esc(t(j.trade))}</p></div></div><div class="pay-row detail-pay"><span class="pay">${money(j.pay)}</span><span class="pay-unit">${esc(t(j.basis))}</span></div><p class="long-copy">${esc(j.tasks)}</p><div class="divider"></div><dl class="terms">${term('Workers needed',j.workersNeeded)}${term('Work location',j.area)}${term('Start date',j.start)}${term('Working hours',j.hours)}${term('Duration',j.duration)}${term('Payment timing',j.paymentTiming)}${term('Payment method',j.paymentMethod)}${term('Tools and materials',j.tools)}${term('Expenses / deductions',j.expenses)}${term('Overtime',j.overtime||t('Not specified'))}</dl><div class="warning" style="margin-top:19px"><p class="small">Publishing adds this fictional listing to the demo. It does not contact workers or guarantee a hire.</p></div><div class="form-actions"><button class="btn btn-secondary" data-action="edit-draft">${ico('back')}${esc(t('Back to edit'))}</button><button class="btn btn-primary" data-action="publish" ${missing.length?'disabled':''}>${ico('check')}${esc(t(state.editingJobId?'Save changes':'Publish job'))}</button></div></section>`}
function renderMyJobs(){const jobs=ownJobs().slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')),apps=state.applications.filter(a=>jobs.some(j=>j.id===a.jobId));return `${pageHead('My Jobs','Your posted jobs','Manage your listings and review applications from one place.',`<button class="btn btn-primary" data-action="new-job">${ico('plus')}${esc(t('Post a new job'))}</button>`)}<div class="stats">${stat('briefcase',jobs.filter(j=>j.status==='Published').length,'Published jobs')}${stat('doc',apps.length,'New applications')}${stat('clock',apps.filter(a=>['Applied','Awaiting employer response'].includes(a.status)).length,'Needs a response')}</div>${jobs.length?`<div class="list">${jobs.map(j=>{const ja=state.applications.filter(a=>a.jobId===j.id);return `<article class="panel list-item"><div class="list-head"><div><h3>${esc(trJob(j,'title'))}</h3><p class="small">${esc(t(j.trade))} · ${esc(j.area)} · ${money(j.pay)} ${esc(t(j.basis))}</p></div>${statusPill(j.status)}</div><div class="item-meta"><span>${esc(t('Workers needed'))}: ${esc(j.workersNeeded??'—')}</span><span>${esc(t('Applicants'))}: ${ja.length}</span></div><div class="item-actions"><button class="btn btn-secondary btn-small" data-action="edit-job" data-id="${esc(j.id)}">${ico('edit')}${esc(t('Edit'))}</button><button class="btn btn-secondary btn-small" data-action="applicants" data-id="${esc(j.id)}">${ico('users')}${esc(t('View applicants'))} (${ja.length})</button><button class="btn ${j.status==='Published'?'btn-danger':'btn-secondary'} btn-small" data-action="toggle-job" data-id="${esc(j.id)}">${esc(t(j.status==='Published'?'Close listing':'Reopen listing'))}</button></div></article>`}).join('')}</div>`:empty('briefcase','No jobs posted yet','Create a job listing with transparent terms to get started.',`<button class="btn btn-primary" data-action="new-job">${esc(t('Create first listing'))}</button>`)}<div class="section-title" style="margin-top:22px"><p class="demo-note">${ico('info')}<span>Fictional demonstration records; no real hiring is performed.</span></p><button class="btn btn-quiet btn-small" data-action="reset-demo">${ico('refresh')}${esc(t('Reset demo data'))}</button></div>`}
function renderApplicants(){const j=jobBy(state.currentJobId);if(!j)return `${pageHead('Applicants','No job selected','')}<button class="btn btn-secondary" data-view="myjobs">${esc(t('Back'))}</button>`;const apps=state.applications.filter(a=>a.jobId===j.id);return `${pageHead('Applicants','Applicants',`${trJob(j,'title')} · ${j.area}`,`<button class="btn btn-secondary" data-view="myjobs">${ico('back')}${esc(t('Back'))}</button>`)}${apps.length?`<div class="list">${apps.map(a=>{const w=state.workerProfiles.find(p=>p.id===a.workerId)||state.worker;return `<article class="panel list-item"><div class="list-head"><div class="profile-hero"><div class="avatar">${esc(initials(w.name))}</div><div><h3>${esc(w.name)}</h3><p class="small">${esc(tradesLabel(w))} · ${esc(w.locality||'')}</p></div></div>${statusPill(a.status)}</div><p class="small" style="margin-top:10px">${esc(arr(w.skills).join(' · '))} · ${esc(w.experience||'')}</p><div class="form-grid" style="margin-top:13px;grid-template-columns:minmax(0,1fr) auto"><div class="field"><label for="s-${esc(a.id)}">${esc(t('Application status'))}</label><select id="s-${esc(a.id)}" data-status="${esc(a.id)}">${['Applied','Awaiting employer response','Shortlisted','Terms to review','Agreed / scheduled','Completed','Declined','Cancelled'].map(s=>`<option value="${esc(s)}" ${a.status===s?'selected':''}>${esc(t(s))}</option>`).join('')}</select></div><div style="display:flex;align-items:end"><button type="button" class="btn btn-primary btn-small" data-action="update-status" data-id="${esc(a.id)}">${esc(t('Update status'))}</button></div></div><div class="item-actions"><button class="btn btn-secondary btn-small" data-action="agreement" data-id="${esc(a.id)}">${esc(t('Review agreement'))}</button></div></article>`}).join('')}</div>`:empty('users','No applicants for this listing yet.','When a worker expresses interest in this job in the demo, their application will appear here.')}`}
function renderEmployerProfile(){const e=state.employer;return `${pageHead('Employer Profile','Employer Profile','Keep the employer label and contact preference clear in the demo.')}<section class="panel pad" style="max-width:760px"><form id="employerForm"><div class="form-grid"><div class="field"><label for="eName">${esc(t('Name'))} *</label><input id="eName" name="name" required maxlength="100" value="${esc(e.name)}"></div><div class="field"><label for="eType">${esc(t('Company / employer type'))}</label><input id="eType" name="type" maxlength="100" value="${esc(e.type)}"></div><div class="field full"><label for="eContact">${esc(t('Contact preference'))}</label><select id="eContact" name="contactPreference">${['Share details only after a worker responds','Use the demo workflow only','To be agreed'].map(v=>`<option value="${esc(v)}" ${e.contactPreference===v?'selected':''}>${esc(t(v))}</option>`).join('')}</select><span class="field-help">Contact details are not made public in this demo.</span></div></div><div class="form-actions"><button type="submit" class="btn btn-primary">${ico('check')}${esc(t('Save profile'))}</button></div></form><div class="divider"></div><p class="demo-note">${ico('info')}<span>Creating an employer profile does not verify identity. No real contact details are required.</span></p></section>`}
function renderAgreement(){const app=appBy(state.currentApplicationId),j=app&&jobBy(app.jobId);if(!app||!j)return `${pageHead('Agreement summary','No job selected','')}<button class="btn btn-secondary" data-view="${state.role==='worker'?'mywork':'myjobs'}">${esc(t('Back'))}</button>`;return `${pageHead('Agreement summary','Agreement summary','Review the proposed terms before marking the work as agreed.')}<section class="panel pad" style="max-width:850px"><h2>${esc(trJob(j,'title'))}</h2><p style="margin-top:6px">${esc(j.company)} · ${esc(j.area)}</p><div class="divider"></div><dl class="terms">${term('Task and responsibilities',trJob(j,'tasks'))}${term('Payment',`${money(j.pay)} ${t(j.basis)}`)}${term('Working hours',j.hours)}${term('Duration',j.duration)}${term('Start date',j.start)}${term('Payment timing',j.paymentTiming)}${term('Payment method',j.paymentMethod)}${term('Tools and materials',j.tools)}${term('Expenses / deductions',j.expenses)}${term('Overtime',j.overtime)}</dl><div class="warning" style="margin-top:19px"><p class="small">${esc(t('This is a demo summary, not a legally binding contract or payment guarantee.'))} If any term is unclear, confirm it before agreeing.</p></div><div class="form-actions"><button class="btn btn-secondary" data-action="agreement-back">${esc(t('Back'))}</button><button class="btn btn-primary" data-action="agree" data-id="${esc(app.id)}">${ico('check')}${esc(t('I have reviewed the terms'))}</button></div></section>`}
function renderReport(){const j=jobBy(state.currentJobId);if(!j)return `${pageHead('Report a concern','No job selected','')}<button class="btn btn-secondary" data-view="find">${esc(t('Back'))}</button>`;return `${pageHead('Report a concern','Report a concern',trJob(j,'title'))}<section class="panel pad" style="max-width:760px"><form id="reportForm"><div class="field"><label for="reportReason">${esc(t('Reason for report'))} *</label><select id="reportReason" name="reason" required>${['Pay is unclear','Listing details are misleading','Upfront fee requested','OTP / PIN / password requested','Task or location changed','Payment dispute','Other concern'].map(v=>`<option value="${esc(v)}">${esc(t(v))}</option>`).join('')}</select></div><div class="field" style="margin-top:14px"><label for="reportDetails">${esc(t('Additional details (optional)'))}</label><textarea id="reportDetails" name="details" maxlength="1000" placeholder="Do not include passwords, OTPs, bank details or private contact information."></textarea></div><div class="warning" style="margin-top:17px"><p class="small">A demo report is recorded locally only. It does not alert a real moderator, employer or government authority.</p></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-view="jobdetail">${esc(t('Cancel'))}</button><button type="submit" class="btn btn-primary">${ico('alert')}${esc(t('Submit demo report'))}</button></div></form></section>`}
function renderView(){switch(state.view){case'find':return renderFind();case'mywork':return renderMyWork();case'profile':return renderProfile();case'help':return renderHelp();case'jobdetail':return renderJobDetail();case'workers':return renderWorkers();case'workerPublic':return renderWorkerPublic();case'post':return renderPost();case'preview':return renderPreview();case'myjobs':return renderMyJobs();case'applicants':return renderApplicants();case'employerProfile':return renderEmployerProfile();case'agreement':return renderAgreement();case'report':return renderReport();default:state.view=state.role==='worker'?'find':'workers';return renderView()}}
function render(){renderNav();$('#content').innerHTML=renderView();translateStatic();translateDomText($('#content'));document.title=`HunarSetu — ${t(state.role==='worker'?'Worker demo':'Employer demo')}`;persist()}
function go(view){state.view=view;render();$('#main').scrollIntoView({block:'start',behavior:'auto'})}
function toggleSave(id){if(state.savedJobs.includes(id)){state.savedJobs=state.savedJobs.filter(x=>x!==id);toast(t('Removed from saved jobs.'))}else{if(!jobBy(id))return;state.savedJobs.push(id);toast(t('Job saved to your list.'))}render()}
function apply(id){const j=jobBy(id);if(!j||j.status!=='Published'){toast(t('The job listing is not available.'));return}if(hasApplied(id)){toast(t('Application already exists for this job.'));return}state.applications.push({id:newId(),jobId:id,workerId:state.worker.id,workerName:state.worker.name,status:'Applied',createdAt:dateToday(),updatedAt:dateToday()});const i=state.workerProfiles.findIndex(p=>p.id===state.worker.id);if(i>=0)state.workerProfiles[i]={...state.worker};else state.workerProfiles.unshift({...state.worker});state.view='mywork';render();toast(t('Application recorded'))}
function modal(title,body,foot=''){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" data-modal-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button type="button" class="icon-button" data-action="close-modal" aria-label="${esc(t('Close'))}">${ico('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot||`<button class="btn btn-primary" data-action="close-modal">${esc(t('Done'))}</button>`}</div></section></div>`;$('.modal',root).focus()}
function publish(){const j=state.draftJob;if(!j)return;const req=['title','trade','tasks','workersNeeded','area','start','hours','duration','pay','basis','paymentTiming','paymentMethod','tools','expenses'];const missing=req.filter(k=>j[k]===undefined||j[k]===null||String(j[k]).trim()==='');if(missing.length){toast(t('Please complete the required fields marked below.'));return}if(state.editingJobId){const i=state.jobs.findIndex(x=>x.id===state.editingJobId);if(i>=0)state.jobs[i]={...state.jobs[i],...j,id:state.editingJobId,employerId:state.employer.id,company:state.employer.name};toast(t('Job updated'))}else{state.jobs.unshift({...j,id:j.id||newId(),employerId:state.employer.id,company:state.employer.name,status:'Published',verified:false});toast(t('Job published'))}state.draftJob=null;state.editingJobId=null;state.view='myjobs';render()}
function updateStatus(id,status){const a=appBy(id);if(!a)return;a.status=status;a.updatedAt=dateToday();render();toast(t('Update status'))}
function saveWorker(form){const f=new FormData(form),w=state.worker;w.name=String(f.get('name')||'').trim();w.trades=String(f.get('trades')||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,12);w.skills=String(f.get('skills')||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,30);w.experience=String(f.get('experience')||'');w.locality=String(f.get('locality')||'').trim();w.employment=String(f.get('employment')||'');w.languages=String(f.get('languages')||'').trim();w.availability=String(f.get('availability')||'');w.samples=String(f.get('samples')||'').trim();w.discoverable=f.get('discoverable')==='on';const i=state.workerProfiles.findIndex(p=>p.id===w.id);if(i>=0)state.workerProfiles[i]={...w};else state.workerProfiles.unshift({...w});render();toast(t('Profile saved'))}
function closeModal(){$('#modalRoot').innerHTML=''}
function resetDemo(){if(!confirm(t('Reset demo data')+'?'))return;state=seedState();render();toast(t('Demo data reset'))}
function translateStatic(){ $$('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});$('#roleSelect').options[0].textContent=t('Worker demo');$('#roleSelect').options[1].textContent=t('Employer demo');const foot=$$('.footer span');if(foot[0])foot[0].textContent='© HunarSetu · '+t('Hackathon demonstration');if(foot[1])foot[1].textContent=t('Fictional sample records. No real hiring, payment, or official submissions occur.') }
function translateDomText(root){if(!root||state.lang==='en')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const raw=n.nodeValue,trimmed=raw.trim();if(!trimmed)continue;const translated=t(trimmed);if(translated!==trimmed)n.nodeValue=raw.replace(trimmed,translated)}root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v&&t(v)!==v)el.setAttribute(a,t(v))}))}
document.addEventListener('click',e=>{
 const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;render();return}
 const view=e.target.closest('[data-view]');if(view){go(view.dataset.view);return}
 const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
 switch(a){
  case'open-job':state.currentJobId=id;go('jobdetail');break;
  case'save':toggleSave(id);break;
  case'apply':apply(id);break;
  case'report':state.currentJobId=id;go('report');break;
  case'clear-filters':state.filters={query:'',trade:'',duration:'',locality:''};render();break;
  case'clear-worker-filters':state.workerFilters={query:'',trade:'',locality:'',availability:'',experience:''};render();break;
  case'new-job':state.draftJob={trade:'Painting',workersNeeded:1,basis:'per day',paymentMethod:'To be agreed',contactPreference:'Share details only after a worker responds'};state.editingJobId=null;go('post');break;
  case'edit-draft':go('post');break;
  case'publish':publish();break;
  case'edit-job':{const j=jobBy(id);if(j&&j.employerId===state.employer.id){state.editingJobId=id;state.draftJob={...j};go('post')}break}
  case'toggle-job':{const j=jobBy(id);if(!j||j.employerId!==state.employer.id)break;j.status=j.status==='Published'?'Closed':'Published';render();toast(t(j.status==='Closed'?'Listing closed':'Job published'));break}
  case'applicants':state.currentJobId=id;go('applicants');break;
  case'update-status':{const select=$(`[data-status="${CSS.escape(id)}"]`);if(select)updateStatus(id,select.value);break}
  case'view-application':{const app=appBy(id);if(app){state.currentApplicationId=id;go('agreement')}break}
  case'agreement':case'review-agreement':{const app=appBy(id);if(app){state.currentApplicationId=id;go('agreement')}break}
  case'agree':{const app=appBy(id);if(app){app.status='Agreed / scheduled';app.updatedAt=dateToday();render();toast(t('Thank you'))}break}
  case'agreement-back':go(state.role==='worker'?'mywork':'applicants');break;
  case'worker-profile':state.currentProfileId=id;go('workerPublic');break;
  case'reset-demo':resetDemo();break;
  case'close-modal':closeModal();break;
 }
});
$('#brandHome').addEventListener('click',e=>{e.preventDefault();go(state.role==='worker'?'find':'workers')});
$('#roleSelect').addEventListener('change',e=>{state.role=e.target.value;state.currentJobId=null;state.view=state.role==='worker'?'find':'workers';render()});
document.addEventListener('submit',e=>{
 if(e.target.id==='jobFilter'){e.preventDefault();const f=new FormData(e.target);state.filters={query:String(f.get('query')||''),trade:String(f.get('trade')||''),duration:String(f.get('duration')||''),locality:String(f.get('locality')||'')};render()}
 else if(e.target.id==='workerSearch'){e.preventDefault();const f=new FormData(e.target);state.workerFilters={query:String(f.get('query')||''),trade:String(f.get('trade')||''),locality:String(f.get('locality')||''),availability:String(f.get('availability')||''),experience:String(f.get('experience')||'')};render()}
 else if(e.target.id==='workerForm'){e.preventDefault();if(e.target.reportValidity())saveWorker(e.target)}
 else if(e.target.id==='employerForm'){e.preventDefault();const f=new FormData(e.target);state.employer.name=String(f.get('name')||'').trim();state.employer.type=String(f.get('type')||'').trim();state.employer.contactPreference=String(f.get('contactPreference')||'');state.jobs.forEach(j=>{if(j.employerId===state.employer.id)j.company=state.employer.name});render();toast(t('Profile saved'))}
 else if(e.target.id==='jobForm'){e.preventDefault();if(!e.target.reportValidity())return;const j=collectJobForm(e.target);if(!Number.isFinite(j.pay)||j.pay<=0||!Number.isInteger(j.workersNeeded)||j.workersNeeded<1){toast(t('Please complete the required fields marked below.'));return}state.draftJob=j;go('preview')}
 else if(e.target.id==='reportForm'){e.preventDefault();const f=new FormData(e.target);state.reports.push({id:newId(),jobId:state.currentJobId,workerId:state.worker.id,reason:String(f.get('reason')||''),details:String(f.get('details')||'').trim(),createdAt:dateToday(),status:'Submitted in this demo'});state.view='jobdetail';render();modal(t('Report recorded'),`<div class="soft"><p>${esc(t('Report recorded in this demo. No authority or moderator has been contacted.'))}</p></div>`,`<button type="button" class="btn btn-primary" data-action="close-modal">${esc(t('Done'))}</button>`)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{const back=e.target.closest('[data-modal-backdrop]');if(back&&e.target===back)closeModal()});
async function boot(){if(location.protocol!=='file:'&&location.hostname){try{const r=await fetch('/api/state',{headers:{Accept:'application/json'}});if(r.ok){apiMode=true;const remote=await r.json();state=remote&&remote.version===1?mergeState(seedState(),remote):mergeState(state,readLocal());setStorageStatus(true)}}catch(_){apiMode=false}}setStorageStatus(apiMode);if(!['en','hi','mr'].includes(state.lang))state.lang='en';if(!['worker','employer'].includes(state.role))state.role='worker';render();if(apiMode)persist()}
boot();
</script>
